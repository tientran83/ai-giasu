
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gia sư Socratic - Dark Mode</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        body { 
            background-color: #121212; 
            color: #e0e0e0;
            display: flex; 
            justify-content: center; 
            height: 100vh; 
            overflow: hidden; /* Cố định màn hình, chỉ cuộn khung chat */
        }

        .chat-container { 
            width: 100%; 
            max-width: 650px; 
            background: #1e1e1e; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); 
        }

        .chat-header { 
            background: #1f2937; 
            color: #38bdf8; 
            padding: 16px; 
            text-align: center; 
            font-size: 1.25rem; 
            font-weight: bold; 
            border-bottom: 1px solid #374151;
            flex-shrink: 0;
        }

        /* Khung chứa tin nhắn cho phép cuộn */
        .chat-box { 
            flex: 1; 
            padding: 20px; 
            overflow-y: scroll; /* Bắt buộc hiển thị tính năng cuộn vertical */
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }

        /* TÙY CHỈNH THANH CUỘN (SCROLLBAR) HIỆN ĐẠI */
        .chat-box::-webkit-scrollbar {
            width: 8px; /* Độ rộng thanh cuộn */
        }
        .chat-box::-webkit-scrollbar-track {
            background: #1e1e1e; /* Màu nền rãnh cuộn */
        }
        .chat-box::-webkit-scrollbar-thumb {
            background: #374151; /* Màu con trượt cuộn */
            border-radius: 4px;
        }
        .chat-box::-webkit-scrollbar-thumb:hover {
            background: #0284c7; /* Đổi màu khi di chuột vào thanh cuộn */
        }

        .message { 
            max-width: 85%; 
            padding: 12px 16px; 
            border-radius: 16px; 
            line-height: 1.5; 
            word-wrap: break-word; 
            font-size: 0.95rem;
            white-space: pre-wrap;
        }

        .user { 
            align-self: flex-end; 
            background: #0284c7; 
            color: #ffffff; 
            border-bottom-right-radius: 4px; 
        }

        .ai { 
            align-self: flex-start; 
            background: #2a2d32; 
            color: #e2e8f0; 
            border-bottom-left-radius: 4px; 
            border: 1px solid #3f444e;
        }

        .typing { 
            font-style: italic; 
            color: #9ca3af; 
            display: none; 
            align-self: flex-start; 
            padding-left: 15px; 
            padding-bottom: 8px; 
            font-size: 0.88rem;
        }

        .input-area { 
            display: flex; 
            padding: 14px; 
            border-top: 1px solid #2d3748; 
            background: #1e1e1e; 
            flex-shrink: 0;
        }

        input { 
            flex: 1; 
            padding: 12px 16px; 
            background: #2d3748;
            color: #ffffff;
            border: 1px solid #4a5568; 
            border-radius: 24px; 
            outline: none; 
            font-size: 1rem; 
        }

        input::placeholder {
            color: #a0aec0;
        }

        input:focus {
            border-color: #38bdf8;
        }

        button { 
            margin-left: 10px; 
            padding: 10px 20px; 
            background: #0284c7; 
            color: white; 
            border: none; 
            border-radius: 24px; 
            cursor: pointer; 
            font-weight: bold; 
            transition: background 0.2s;
        }

        button:hover { 
            background: #0369a1; 
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">🎓 AI Gia sư Socratic</div>
        <div class="chat-box" id="chatBox">
            <div class="message ai">Chào em! Hôm nay chúng ta sẽ cùng tìm hiểu bài học nào? Em cứ đưa câu hỏi hoặc chủ đề lên nhé!</div>
        </div>
        <div class="typing" id="typing">AI Gia sư đang suy nghĩ...</div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Nhập câu hỏi của bạn..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <script>
        let chatHistory = [];

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            appendMessage('user', message);
            input.value = '';

            const typing = document.getElementById('typing');
            typing.style.display = 'block';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history: chatHistory, message: message })
                });

                const data = await res.json();
                typing.style.display = 'none';

                if (res.ok) {
                    appendMessage('ai', data.reply);
                    chatHistory.push({ role: 'user', text: message });
                    chatHistory.push({ role: 'model', text: data.reply });
                } else {
                    appendMessage('ai', 'Lỗi: ' + (data.detail || 'Không thể kết nối API'));
                }
            } catch (err) {
                typing.style.display = 'none';
                appendMessage('ai', 'Đã xảy ra lỗi kết nối!');
            }
        }

        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            
            // Tự động cuộn xuống dưới cùng mỗi khi có tin nhắn mới
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
