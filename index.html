<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gia sư Socratic</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e2e; color: #fff; margin: 0; padding: 20px; display: flex; flex-direction: column; height: 90vh; }
        h1 { text-align: center; font-size: 1.2rem; }
        #chat-box { flex: 1; overflow-y: auto; border: 1px solid #444; padding: 10px; border-radius: 8px; margin-bottom: 10px; background: #181825; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; max-width: 80%; }
        .user { background: #007bff; align-self: flex-end; margin-left: auto; }
        .ai { background: #313244; align-self: flex-start; }
        #input-container { display: flex; gap: 10px; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #444; background: #313244; color: #fff; }
        button { padding: 10px 20px; border-radius: 5px; border: none; background: #007bff; color: #fff; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🎓 AI Gia sư Socratic</h1>
    <div id="chat-box">
        <div class="message ai">Chào bạn! Hôm nay chúng ta sẽ cùng học chủ đề nào? Hãy gửi câu hỏi cho mình nhé!</div>
    </div>
    <div id="input-container">
        <input type="text" id="user-input" placeholder="Nhập câu hỏi tại đây...">
        <button onclick="sendMessage()">Gửi</button>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById("user-input");
            const message = input.value.trim();
            if (!message) return;

            const chatBox = document.getElementById("chat-box");
            
            const userDiv = document.createElement("div");
            userDiv.className = "message user";
            userDiv.innerText = message;
            chatBox.appendChild(userDiv);
            input.value = "";

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: message })
                });
                const data = await response.json();
                
                const aiDiv = document.createElement("div");
                aiDiv.className = "message ai";
                aiDiv.innerText = data.response || data.reply || data.message || "Không nhận được phản hồi";
                chatBox.appendChild(aiDiv);
            } catch (err) {
                const aiDiv = document.createElement("div");
                aiDiv.className = "message ai";
                aiDiv.innerText = "Lỗi kết nối Server!";
                chatBox.appendChild(aiDiv);
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
