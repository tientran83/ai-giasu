<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Gia sư Socratic</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f0f2f5; display: flex; justify-content: center; height: 100vh; }
        .chat-container { width: 100%; max-width: 600px; background: #fff; display: flex; flex-direction: column; height: 100vh; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .chat-header { background: #0084ff; color: #fff; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
        .chat-box { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 18px; line-height: 1.4; word-wrap: break-word; }
        .user { align-self: flex-end; background: #0084ff; color: #fff; border-bottom-right-radius: 4px; }
        .ai { align-self: flex-start; background: #e4e6eb; color: #000; border-bottom-left-radius: 4px; }
        .typing { font-style: italic; color: #888; display: none; align-self: flex-start; padding-left: 15px; padding-bottom: 5px; }
        .input-area { display: flex; padding: 10px; border-top: 1px solid #ddd; background: #fff; }
        input { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 1rem; }
        button { margin-left: 8px; padding: 10px 18px; background: #0084ff; color: white; border: none; border-radius: 20px; cursor: pointer; font-weight: bold; }
        button:hover { background: #006bce; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">🎓 AI Gia sư Socratic</div>
        <div class="chat-box" id="chatBox">
            <div class="message ai">Chào em! Hôm nay chúng ta sẽ cùng tìm hiểu bài học nào? Em cứ đưa câu hỏi hoặc chủ đề lên nhé!</div>
        </div>
        <div class="typing" id="typing">AI Gia sư đang suy nghĩ...</div>
        <div class="input-area">
            <input type="text" id="userInput" placeholder="Nhập câu hỏi của bạn..." onkeydown="if(event.key==='Enter') sendMessage()">
            <button onclick="sendMessage()">Gửi</button>
        </div>
    </div>

    <script>
        let chatHistory = [];

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            appendMessage('user', message);
            input.value = '';

            const typing = document.getElementById('typing');
            typing.style.display = 'block';

            try {
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ history: chatHistory, message: message })
                });

                const data = await res.json();
                typing.style.display = 'none';

                if (res.ok) {
                    appendMessage('ai', data.reply);
                    chatHistory.push({ role: 'user', text: message });
                    chatHistory.push({ role: 'model', text: data.reply });
                } else {
                    appendMessage('ai', 'Lỗi: ' + (data.detail || 'Không thể kết nối API'));
                }
            } catch (err) {
                typing.style.display = 'none';
                appendMessage('ai', 'Đã xảy ra lỗi kết nối!');
            }
        }

        function appendMessage(sender, text) {
            const chatBox = document.getElementById('chatBox');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
